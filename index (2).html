<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4392E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Giỏi Tiếng Trung Cùng Lân Học Bá - HSK3</title>
<style>
:root{
  --red:#E4392E; --red-dark:#B92A22; --red-deep:#8E1D18;
  --gold:#FFB43A; --gold-light:#FFE1A8; --cream:#FFF6E9;
  --paper:#FFFFFF; --ink:#4A2A1D; --ink-soft:#8C6E5E;
  --green:#3FB673; --green-dark:#2A8C57;
  --blue:#4C8DFF; --blue-dark:#2F6FE0;
  --purple:#9B6BFF; --purple-dark:#7B4CE0;
  --pink:#FF6FA0; --pink-dark:#E24C82;
  --shadow: 0 6px 0 rgba(0,0,0,.12);
  --radius: 22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cream:#241611; --paper:#33221B; --ink:#F6E9DD; --ink-soft:#CBB09C;
    --gold-light:#5C4527;
  }
}
:root[data-theme="dark"]{
  --cream:#241611; --paper:#33221B; --ink:#F6E9DD; --ink-soft:#CBB09C;
  --gold-light:#5C4527;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-drag:none;}
html{
  scroll-padding-top:env(safe-area-inset-top,0px);
  height:100%;
  width:100%;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
  overscroll-behavior-y:none;
  overflow-x:hidden;
}
body{
  margin:0; min-height:100%; min-height:100dvh;
  width:100%;
  max-width:100vw;
  overflow-x:hidden;
  background: var(--cream);
  background-image:
    radial-gradient(circle at 8% 12%, rgba(255,180,58,.18) 0, transparent 40%),
    radial-gradient(circle at 92% 85%, rgba(228,57,46,.12) 0, transparent 45%);
  background-attachment:local;
  font-family:'Times New Roman', Times, 'Noto Serif', serif;
  color:var(--ink);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y:none;
  -webkit-touch-callout:none;
}
img{-webkit-user-drag:none; -khtml-user-drag:none; -moz-user-drag:none; user-drag:none; -webkit-touch-callout:none;}
.hanzi{font-family:'Songti SC','STSong','SimSun','Noto Serif SC','Source Han Serif SC','Microsoft YaHei',serif;}
h1,h2,h3,.btn,.tab,.big-hanzi{font-family:'Times New Roman', Times, serif;}
p,.vi,.meaning,.pinyin,li{font-family:'Times New Roman', Times, serif;}

#app{max-width:720px;margin:0 auto;padding:16px 16px 48px;min-height:100vh;min-height:100dvh;}
@media(min-width:760px){
  body{padding:24px 16px;}
  #app{min-height:0; padding:28px 28px 52px; background:rgba(255,255,255,.35); border-radius:32px; box-shadow:0 20px 60px rgba(142,29,24,.12);}
}


/* ---------- HEADER / HOME ---------- */
.hero{
  background:linear-gradient(160deg,var(--red) 0%, var(--red-dark) 65%, var(--red-deep) 100%);
  border-radius:28px; padding:26px 22px 22px; color:#fff; position:relative; overflow:hidden;
  box-shadow:0 10px 0 rgba(142,29,24,.35);
}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08);}
.hero::before{width:160px;height:160px; top:-60px; right:-40px;}
.hero::after{width:110px;height:110px; bottom:-50px; left:-30px;}
.hero-top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative;z-index:1;}
.mascot{filter:drop-shadow(0 4px 0 rgba(0,0,0,.15)); animation:bob 2.8s ease-in-out infinite;}
.mascot img{display:block; width:100%; max-width:300px; height:auto; margin:0 auto;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.hero h1{margin:4px 0 0; font-size:1.32rem; line-height:1.2; letter-spacing:.2px;}
.hero .sub{margin:6px auto 0; font-size:.95rem; opacity:.92; max-width:320px;}
.hero-stats{display:flex;gap:10px;margin-top:16px;position:relative;z-index:1;}
.stat-chip{background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35); border-radius:14px; padding:8px 12px; font-size:.82rem; flex:1;}
.stat-chip b{display:block;font-size:1.15rem;}

.section-title{margin:26px 4px 12px; font-size:1.15rem; color:var(--red-dark); display:flex; align-items:center; gap:8px;}

.lesson-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media(min-width:520px){.lesson-grid{grid-template-columns:1fr 1fr 1fr;}}
.lesson-card{
  background:var(--paper); border-radius:18px; padding:14px 12px; text-align:left; cursor:pointer;
  border:2px solid #FFE6C4; box-shadow:0 5px 0 #F0DAB8; transition:transform .12s;
  display:flex; flex-direction:column; gap:6px; position:relative;
  touch-action:manipulation; -webkit-touch-callout:none;
  -webkit-user-select:none; user-select:none;
}
.lesson-card:active{transform:translateY(3px); box-shadow:0 2px 0 #F0DAB8;}
@media (hover:hover) and (pointer:fine){
  .lesson-card:hover{transform:translateY(-2px); box-shadow:0 7px 0 #F0DAB8;}
}
.lesson-card .badge{
  position:absolute; top:10px; right:10px; background:var(--gold); color:#6B3E00; font-size:.68rem;
  font-weight:700; padding:2px 8px; border-radius:10px;
}
.lesson-card .num{font-size:.72rem; color:var(--ink-soft); font-weight:700;}
.lesson-card .icon{font-size:1.6rem;}
.lesson-card .hz{font-size:1rem; font-weight:700; color:var(--ink);}
.lesson-card .vi{font-size:.78rem; color:var(--ink-soft); line-height:1.25;}
.lesson-card .stars{font-size:.85rem; letter-spacing:1px;}
.star-on{color:var(--gold);} .star-off{color:#E7DCC9;}

/* ---------- BACK BAR ---------- */
.topbar{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
.iconbtn{
  background:#fff; border:2px solid #FFE1A8; border-radius:14px; width:42px; height:42px; min-width:42px;
  display:flex; align-items:center; justify-content:center; font-size:1.2rem; cursor:pointer; box-shadow:0 4px 0 #F0DAB8;
  touch-action:manipulation; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
}
.iconbtn:active{transform:translateY(3px); box-shadow:none;}
@media (hover:hover) and (pointer:fine){
  .iconbtn:hover{border-color:var(--gold);}
}
.topbar .title{font-weight:700; color:var(--red-dark); font-size:1.05rem;}

/* ---------- LESSON DETAIL ---------- */
.lesson-banner{background:var(--paper); border-radius:22px; padding:18px; display:flex; gap:14px; align-items:center; border:2px solid #FFE6C4;}
.lesson-banner .icon{font-size:2.4rem;}
.lesson-banner .hz{font-size:1.25rem; font-weight:700;}
.lesson-banner .vi{color:var(--ink-soft); font-size:.9rem;}
.total-score{margin-top:10px; font-size:.85rem; color:var(--ink-soft);}
.total-score b{color:var(--red-dark);}

.mode-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px;}
.mode-card{
  border-radius:20px; padding:16px 14px; color:#fff; cursor:pointer; position:relative; overflow:hidden;
  box-shadow:0 6px 0 rgba(0,0,0,.15); min-height:120px; display:flex; flex-direction:column; justify-content:space-between;
  touch-action:manipulation; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
}
.mode-card:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.15);}
@media (hover:hover) and (pointer:fine){
  .mode-card:hover{transform:translateY(-2px); box-shadow:0 8px 0 rgba(0,0,0,.15);}
}
.mode-card .m-icon{font-size:1.8rem;}
.mode-card .m-name{font-weight:700; font-size:1rem; margin-top:6px;}
.mode-card .m-score{font-size:.75rem; opacity:.9; margin-top:8px; background:rgba(255,255,255,.22); border-radius:10px; padding:3px 8px; align-self:flex-start;}
.mode-1{background:linear-gradient(150deg,var(--blue),var(--blue-dark));}
.mode-2{background:linear-gradient(150deg,var(--pink),var(--pink-dark));}
.mode-3{background:linear-gradient(150deg,var(--purple),var(--purple-dark));}
.mode-4{background:linear-gradient(150deg,var(--green),var(--green-dark));}

/* ---------- GAME SCREEN ---------- */
.game-head{display:flex; align-items:center; gap:10px;}
.progressbar{flex:1; height:14px; background:#F0E2C8; border-radius:10px; overflow:hidden;}
.progressbar > div{height:100%; background:linear-gradient(90deg,var(--gold),var(--red)); border-radius:10px; transition:width .3s;}
.score-badge{background:var(--gold); color:#6B3E00; font-weight:700; border-radius:12px; padding:6px 12px; font-size:.85rem; white-space:nowrap;}

.card{background:var(--paper); border-radius:22px; padding:22px 18px; margin-top:16px; border:2px solid #FFE6C4; box-shadow:0 6px 0 #F0DAB8;}
.qmeta{text-align:center; color:var(--ink-soft); font-size:.82rem; margin-bottom:6px;}
.big-hanzi{font-size:2.6rem; text-align:center; margin:6px 0;}
.big-pinyin{text-align:center; color:var(--ink-soft); font-size:1.05rem; margin-bottom:4px;}

.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px;}
.opt-btn{
  background:#FFF9EF; border:2px solid #FFE1A8; border-radius:16px; padding:14px 10px; font-size:.92rem;
  cursor:pointer; font-weight:600; color:var(--ink); transition:.12s;
  touch-action:manipulation; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
  min-height:44px;
}
.opt-btn:active{transform:scale(.97);}
@media (hover:hover) and (pointer:fine){
  .opt-btn:not([disabled]):hover{border-color:var(--red); background:#FFF3E0;}
}
.opt-btn.correct{background:#DFF6E7; border-color:var(--green); color:var(--green-dark);}
.opt-btn.wrong{background:#FCE1E1; border-color:var(--red); color:var(--red-dark);}
.opt-btn[disabled]{cursor:default;}

/* drag-match */
.match-wrap{display:flex; gap:10px; margin-top:14px;}
.match-col{flex:1; display:flex; flex-direction:column; gap:10px;}
.match-card{
  background:#FFF9EF; border:2px solid #FFE1A8; border-radius:14px; padding:10px 8px; text-align:center;
  font-weight:600; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  position:relative; z-index:2; cursor:grab;
}
.match-card .p{font-size:.68rem; color:var(--ink-soft); font-weight:400;}
.match-card.dragging{opacity:.85; box-shadow:0 8px 18px rgba(0,0,0,.25); cursor:grabbing;}
.match-card.locked{background:#DFF6E7; border-color:var(--green); color:var(--green-dark); cursor:default;}
.drop-slot{
  background:#fff; border:2px dashed #E9C98C; border-radius:14px; padding:10px 8px; text-align:center;
  font-size:.85rem; color:var(--ink-soft); min-height:52px; display:flex; align-items:center; justify-content:center;
}
.drop-slot.over{border-color:var(--blue); background:#EAF1FF;}
.drop-slot.filled{border-style:solid; color:var(--ink); font-weight:600;}
.drop-slot.locked{background:#DFF6E7; border-color:var(--green); color:var(--green-dark);}

/* reorder */
.sentence-vi{text-align:center; color:var(--ink-soft); font-size:.92rem; margin-bottom:10px;}
.answer-strip{min-height:56px; background:#FFF9EF; border:2px dashed #E9C98C; border-radius:14px; display:flex; flex-wrap:wrap; gap:8px; padding:10px; margin-bottom:14px;}
.pool-strip{display:flex; flex-wrap:wrap; gap:8px; justify-content:center;}
.chip{
  background:#fff; border:2px solid #FFE1A8; border-radius:12px; padding:8px 12px; font-size:1.1rem; cursor:pointer; font-weight:600;
  touch-action:manipulation; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
}
.chip:active{transform:scale(.95);}
.chip.used{opacity:.3; pointer-events:none;}
.chip.in-answer{background:#FFE9CE; border-color:var(--gold);}

/* fill blank */
.fb-sentence{text-align:center; font-size:1.6rem; margin:10px 0; line-height:1.6;}
.fb-blank{display:inline-block; min-width:52px; border-bottom:3px solid var(--red); color:var(--red-dark); font-weight:700;}

.check-row{display:flex; gap:10px; margin-top:16px;}
.btn{
  border:none; border-radius:16px; padding:13px 18px; font-size:1rem; font-weight:700; cursor:pointer; flex:1;
  box-shadow:0 5px 0 rgba(0,0,0,.18);
  touch-action:manipulation; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
  min-height:44px;
}
.btn:active{transform:translateY(3px); box-shadow:none;}
@media (hover:hover) and (pointer:fine){
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost:hover{border-color:var(--red);}
}
.btn-primary{background:var(--red); color:#fff;}
.btn-ghost{background:#fff; color:var(--red-dark); border:2px solid #FFE1A8; box-shadow:0 5px 0 #F0DAB8;}
.btn[disabled]{opacity:.4; cursor:default;}

.feedback{text-align:center; margin-top:12px; font-weight:700; min-height:24px;}
.feedback.ok{color:var(--green-dark);}
.feedback.bad{color:var(--red-dark);}

/* ---------- RESULT ---------- */
.result-wrap{text-align:center; padding:30px 10px;}
.result-wrap .emoji{font-size:4rem;}
.result-wrap h2{color:var(--red-dark); margin:10px 0 4px;}
.result-score{font-size:2.4rem; font-weight:800; color:var(--gold); text-shadow:0 3px 0 var(--red-dark);}
.result-wrap .msg{color:var(--ink-soft); margin:8px 0 20px;}

canvas#confetti{position:fixed; inset:0; pointer-events:none; z-index:50;}

.footer-note{text-align:center; color:var(--ink-soft); font-size:.75rem; margin-top:30px;}

@media (prefers-reduced-motion: reduce){
  .mascot{animation:none;}
}

html{touch-action:manipulation;}
#app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.hanzi{font-family:'PingFang SC','Songti SC','STSong','Noto Serif CJK SC','Noto Serif SC','Source Han Serif SC','Microsoft YaHei','SimSun','Droid Sans Fallback',serif;}
.match-card.sel{border-color:var(--blue);background:#EAF1FF;box-shadow:0 0 0 3px rgba(76,141,255,.35);}
.drop-slot{cursor:pointer;}
[data-goto]:focus-visible,.opt-btn:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
@media(max-width:380px){.big-hanzi{font-size:2.1rem;}.fb-sentence{font-size:1.35rem;}.opt-btn{font-size:.85rem;padding:12px 6px;}.lesson-grid{gap:8px;}.hero h1{font-size:1.15rem;}}
@media(max-height:480px) and (orientation:landscape){.mascot img{max-width:150px;}#app{max-width:900px;}.opt-grid{grid-template-columns:1fr 1fr 1fr 1fr;}}
@media(min-width:1000px){#app{max-width:820px;}}
</style>
</head>

<script>

  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
}

  {key:'mc', name:'Trắc nghiệm từ vựng', icon:'🧠', cls:'mode-1'},

/* ====================== SOUND ====================== */
let actx;
function ac(){
  if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  // iOS/Safari suspends new AudioContexts until a user gesture resumes them.
  if(actx.state==='suspended'){ actx.resume().catch(()=>{}); }
  return actx;
}
// Some iOS/Android browsers only allow the very first resume() call made
// synchronously inside a real user-gesture handler; prime it here too.
['pointerdown','touchend','click'].forEach(evt=>{
  document.addEventListener(evt, function unlockAudio(){
    try{ ac(); }catch(err){}
  }, {once:true, passive:true});
});
function beep(freq, dur, type='sine', vol=.18, delay=0){
  try{
    const c = ac(); const t0 = c.currentTime + delay;
    const osc = c.createOscillator(); const gain = c.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }catch(e){}
}
function soundCorrect(){ beep(880,.14,'sine',.2,0); beep(1320,.18,'sine',.18,.1); }
function soundWrong(){ beep(220,.22,'sawtooth',.15,0); }
function soundComplete(){
  [523,659,784,1046].forEach((f,i)=>beep(f,.22,'triangle',.18,i*.13));
}

/* ====================== CONFETTI ====================== */
function confettiBurst(){
  let cv = document.getElementById('confetti');
  if(!cv){
    cv = document.createElement('canvas'); cv.id='confetti';
    document.body.appendChild(cv);
  }
  cv.width = innerWidth; cv.height = innerHeight;
  const ctx = cv.getContext('2d');
  const colors = ['#E4392E','#FFB43A','#3FB673','#4C8DFF','#9B6BFF','#FF6FA0'];
  let parts = [];
  for(let i=0;i<90;i++){
    parts.push({
      x: Math.random()*cv.width, y: -20-Math.random()*cv.height*0.4,
      vx:(Math.random()-.5)*3, vy:2+Math.random()*3.5,
      size:5+Math.random()*6, color:colors[i%colors.length],
      rot:Math.random()*360, vr:(Math.random()-.5)*10
    });
  }
  let frame=0;
  function tick(){
    frame++;
    ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.03; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6);
      ctx.restore();
    });
    if(frame<130){ requestAnimationFrame(tick); }
    else { cv.remove(); }
  }
  tick();
}

/* ====================== HELPERS ====================== */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pickN(arr,n){ return shuffle(arr).slice(0,n); }
function lessonById(id){ return LESSONS.find(l=>l.id===id); }
function bestScore(lessonId,modeKey){
  return (PROGRESS[lessonId] && PROGRESS[lessonId][modeKey]) || 0;
}
function setScore(lessonId,modeKey,score){
  if(!PROGRESS[lessonId]) PROGRESS[lessonId]={};
  if(score > (PROGRESS[lessonId][modeKey]||0)){
    PROGRESS[lessonId][modeKey]=score;
    saveProgress(PROGRESS);
  }
}
function lessonTotal(lessonId){
  const p = PROGRESS[lessonId]||{};
  return MODES.reduce((s,m)=>s+(p[m.key]||0),0);
}
function starsFor(lessonId){
  const t = lessonTotal(lessonId);
  if(t>=100) return 3; if(t>=60) return 2; if(t>=20) return 1; return 0;
}

/* ====================== GAME SESSION BUILD ====================== */
function buildQuestions(lessonId, modeKey){
  const l = lessonById(lessonId);
  const otherWords = LESSONS.filter(x=>x.id!==lessonId).flatMap(x=>x.words);

  if(modeKey==='mc'){
    const chosen = pickN(l.words,5);
    return chosen.map(w=>{
      const distract = pickN(l.words.filter(x=>x!==w).concat(pickN(otherWords,6)),3).map(x=>x[2]);
      const opts = shuffle([w[2],...distract.slice(0,3)]);
      return {type:'mc', hz:w[0], py:w[1], answer:w[2], opts};
    });
  }
  if(modeKey==='dragdrop'){
    const chosen = pickN(l.words,5);
    return [{type:'dragdrop', pairs:chosen}];
  }
  if(modeKey==='reorder'){
    return l.sents.map(s=>({type:'reorder', tokens:s[0], vi:s[1]}));
  }
  if(modeKey==='fillblank'){
    return l.sents.map(s=>{
      const tokens = s[0];
      // pick a content token (len>0, not punctuation) to blank
      const candIdx = tokens.map((t,i)=>i).filter(i=>!['，','。','！','？'].includes(tokens[i]));
      const idx = s[2]!==undefined ? s[2] : candIdx[Math.floor(Math.random()*candIdx.length)];
      const answer = tokens[idx];
      const pool = shuffle(GW.filter(h=>h!==answer && !tokens.includes(h)));
      const opts = shuffle([answer, ...pool.slice(0,3)]);
      return {type:'fillblank', tokens, blankIdx:idx, answer, opts, vi:s[1]};
    });
  }
}

/* ====================== RENDER: GAME ====================== */
function renderPlay(lessonId, modeKey){
  const l = lessonById(lessonId);
  const modeDef = MODES.find(m=>m.key===modeKey);
  if(!game || game.lessonId!==lessonId || game.modeKey!==modeKey || game.fresh){
    game = {
      lessonId, modeKey, qIndex:0, score:0,
      questions: buildQuestions(lessonId, modeKey),
      answered:false, fresh:false
    };
  }
  const pct = modeKey==='dragdrop'
    ? Math.round(((game.ddState?game.ddState.lockedCount:0)/5)*100)
    : Math.round((game.qIndex/5)*100);

  let body = '';
  if(modeKey==='mc') body = renderMC();
  else if(modeKey==='dragdrop') body = renderDragDrop();
  else if(modeKey==='reorder') body = renderReorder();
  else if(modeKey==='fillblank') body = renderFillBlank();

  return `
  <div class="topbar">
    <div class="iconbtn" data-goto="lesson" data-id="${lessonId}">←</div>
    <div class="title">${modeDef.icon} ${modeDef.name} · Bài ${l.id}</div>
  </div>
  <div class="game-head">
    <div class="progressbar"><div style="width:${pct}%"></div></div>
    <div class="score-badge">⭐ ${game.score}</div>
  </div>
  <div id="game-body">${body}</div>
  `;
}

function renderMC(){
  const q = game.questions[game.qIndex];

    <div class="qmeta">Câu ${game.qIndex+1}/5 · Chọn nghĩa đúng</div>
    <div class="big-hanzi hanzi">${q.hz}</div>
    <div class="big-pinyin">${q.py}</div>
    <div class="opt-grid">
      ${q.opts.map(o=>`<button class="opt-btn" data-mc="${encodeURIComponent(o)}">${o}</button>`).join('')}
    </div>
    <div class="feedback" id="feedback"></div>
  </div>`;
}

function renderReorder(){
  const q = game.questions[game.qIndex];
  if(!game.reorderState || game.reorderState.qIndex!==game.qIndex){
    game.reorderState = {qIndex:game.qIndex, pool: shuffle(q.tokens.map((t,i)=>({t,i}))), answer:[]};
  }
  const st = game.reorderState;
  return `
  <div class="card">
    <div class="qmeta">Câu ${game.qIndex+1}/5 · Sắp xếp thành câu đúng</div>
    <div class="sentence-vi">💬 ${q.vi}</div>
    <div class="answer-strip" id="answer-strip">
      ${st.answer.map((it,pos)=>`<span class="chip in-answer hanzi" data-ans-pos="${pos}">${it.t}</span>`).join('')}
    </div>
    <div class="pool-strip" id="pool-strip">

    <div class="feedback" id="feedback"></div>

}

function renderFillBlank(){
  const q = game.questions[game.qIndex];
  const shown = q.tokens.map((t,i)=> i===q.blankIdx ? '<span class="fb-blank">＿＿</span>' : `<span class="hanzi">${t}</span>`).join('');
  return `
  <div class="card">
    <div class="qmeta">Câu ${game.qIndex+1}/5 · Điền từ còn thiếu</div>
    <div class="sentence-vi">💬 ${q.vi}</div>
    <div class="fb-sentence">${shown}</div>

  </div>`;
}

function renderDragDrop(){
  const q = game.questions[0];
  if(!game.ddState){
    game.ddState = {
      left: q.pairs.map((p,i)=>({...{hz:p[0],py:p[1]},id:i})),
      right: shuffle(q.pairs.map((p,i)=>({vi:p[2],id:i}))),
      locked: {}, lockedCount:0
    };
  }
  const st = game.ddState;
  return `
  <div class="card">
    <div class="qmeta">Kéo mỗi thẻ Hán tự sang đúng nghĩa của nó (${st.lockedCount}/5)</div>
    <div class="match-wrap">
      <div class="match-col" id="left-col">
        ${st.left.map(it=>`<div class="match-card hanzi ${st.locked[it.id]?'locked':''} ${st.sel===it.id?'sel':''}" data-drag-id="${it.id}">
          ${it.hz}<div class="p">${it.py}</div></div>`).join('')}
      </div>
      <div class="match-col" id="right-col">
        ${st.right.map(it=>`<div class="drop-slot ${st.locked[it.id]?'locked filled':''}" data-drop-id="${it.id}">
          ${st.locked[it.id] ? lessonById(game.lessonId).words.find(w=>w[0]===st.locked[it.id])[0] : it.vi}</div>`).join('')}
      </div>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>`;
}

/* ====================== MAIN RENDER DISPATCH ====================== */
function render(){
  const app = document.getElementById('app');
  if(nav.screen==='home') app.innerHTML = renderHome();
  else if(nav.screen==='lesson') app.innerHTML = renderLesson(nav.lessonId);
  else if(nav.screen==='play') app.innerHTML = renderPlay(nav.lessonId, nav.mode);
  else if(nav.screen==='result') app.innerHTML = renderResult();
  window.scrollTo(0,0);
  attachDragHandlers();
  document.querySelectorAll('[data-goto]').forEach(x=>{x.tabIndex=0;x.setAttribute('role','button');});
}

/* ====================== NAV HANDLER ====================== */
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-goto]');
  if(el){
    const goto = el.dataset.goto;
    if(goto==='home'){ nav={screen:'home'}; game=null; render(); return; }
    if(goto==='lesson'){ nav={screen:'lesson', lessonId:+el.dataset.id}; game=null; render(); return; }
    if(goto==='play'){
      nav={screen:'play', lessonId:+el.dataset.id, mode:el.dataset.mode};
      if(el.dataset.fresh || !game || game.lessonId!==nav.lessonId || game.modeKey!==nav.mode) game=null;
      render(); return;
    }
  }
  handleGameClick(e);
});

/* ====================== GAME INTERACTIONS ====================== */
function nextQuestionOrFinish(){
  const isDD = game.modeKey==='dragdrop';
  if(isDD){ finishGame(); return; }
  game.qIndex++;
  if(game.qIndex>=5){ finishGame(); }
  else { render(); }
}
function finishGame(){
  const total = game.modeKey==='dragdrop' ? game.ddMax : 25;
  setScore(game.lessonId, game.modeKey, game.score);
  nav.screen='result';
  const app = document.getElementById('app');
  app.innerHTML = renderResult();
  soundComplete();
  confettiBurst();
}

function markFeedback(ok){
  const fb = document.getElementById('feedback');
  if(fb){ fb.textContent = ok ? '✅ Chính xác! +5 điểm' : '❌ Chưa đúng, xem đáp án nhé!'; fb.className='feedback '+(ok?'ok':'bad'); }
  if(ok){ soundCorrect(); } else { soundWrong(); }
}

function handleGameClick(e){
  if(!game) return;
  // Multiple choice
  const mcBtn = e.target.closest('[data-mc]');
  if(mcBtn && !game.answered){
    const val = decodeURIComponent(mcBtn.dataset.mc);
    const q = game.questions[game.qIndex];
    game.answered = true;
    const buttons = document.querySelectorAll('[data-mc]');
    buttons.forEach(b=>{
      b.disabled=true;
      const bv = decodeURIComponent(b.dataset.mc);
      if(bv===q.answer) b.classList.add('correct');
      else if(b===mcBtn) b.classList.add('wrong');
    });
    const ok = val===q.answer;
    if(ok) game.score+=5;
    markFeedback(ok);
    setTimeout(()=>{ game.answered=false; nextQuestionOrFinish(); }, 1100);
    return;
  }
  // Fill blank
  const fbBtn = e.target.closest('[data-fb]');
  if(fbBtn && !game.answered){
    const val = decodeURIComponent(fbBtn.dataset.fb);
    const q = game.questions[game.qIndex];
    game.answered = true;
    const buttons = document.querySelectorAll('[data-fb]');
    buttons.forEach(b=>{
      b.disabled=true;
      const bv = decodeURIComponent(b.dataset.fb);
      if(bv===q.answer) b.classList.add('correct');
      else if(b===fbBtn) b.classList.add('wrong');
    });
    const ok = val===q.answer;
    if(ok) game.score+=5;
    markFeedback(ok);
    setTimeout(()=>{ game.answered=false; nextQuestionOrFinish(); }, 1100);
    return;
  }
  // Nối từ: chạm thẻ Hán tự rồi chạm ô nghĩa
  const slotEl = e.target.closest('.drop-slot');
  if(slotEl && game.modeKey==='dragdrop' && game.ddState && game.ddState.sel!=null && !slotEl.classList.contains('locked')){
    dropOn(game.ddState.sel, slotEl); render(); return;
  }
  // Reorder: tap pool chip -> add to answer
  const poolChip = e.target.closest('[data-pool-pos]');
  if(poolChip){
    const st = game.reorderState;
    const pos = +poolChip.dataset.poolPos;
    const it = st.pool[pos];
    if(st.answer.find(a=>a.i===it.i)) return;
    st.answer.push(it);
    render();
    return;
  }
  // Reorder: tap answer chip -> remove
  const ansChip = e.target.closest('[data-ans-pos]');
  if(ansChip){
    const st = game.reorderState;
    const pos = +ansChip.dataset.ansPos;
    st.answer.splice(pos,1);
    render();
    return;
  }
  // Reorder: reset
  if(e.target.closest('#reset-btn')){
    game.reorderState.answer = [];
    render();
    return;
  }
  // Reorder: check
  if(e.target.closest('#check-btn')){
    const q = game.questions[game.qIndex];
    const st = game.reorderState;
    if(st.answer.length !== q.tokens.length){ markFeedback(false); return; }
    const built = st.answer.map(a=>a.t).join('');
    const correct = q.tokens.join('');
    const ok = built===correct;
    if(ok) game.score+=5;
    markFeedback(ok);
    if(!ok){
      // show correct order briefly by disabling pool
    }
    setTimeout(()=>{ nextQuestionOrFinish(); }, ok?900:1600);
    return;
  }
}

function dropOn(id,slot){
  const st=game.ddState, dropId=+slot.dataset.dropId;
  const it=st.left.find(li=>li.id===id);
  if(dropId===it.id){
    st.locked[id]=it.hz; st.lockedCount++; st.sel=null; game.score+=5; markFeedback(true);
    if(st.lockedCount>=5){ game.ddMax=25; setTimeout(()=>finishGame(),700); }
  } else { markFeedback(false); }
}
/* ---- Drag & drop + chạm để nối (pointer events, cross device) ---- */
function attachDragHandlers(){
  const cards = document.querySelectorAll('.match-card[data-drag-id]');
  cards.forEach(card=>{
    card.addEventListener('pointerdown', onPointerDown);
  });
}
let dragCtx = null;
function onPointerDown(e){
  const card = e.currentTarget;
  const id = +card.dataset.dragId;
  if(game.ddState.locked[id]) return;
  // Prevent iOS/Android from starting a text-selection, page-scroll or
  // "magnifier" gesture on the card when the drag begins.
  e.preventDefault();
  // Route all further pointer events to this element even if the finger/
  // mouse moves off it fast — keeps drag reliable on Android WebViews.
  try{ card.setPointerCapture(e.pointerId); }catch(err){}
  const rect = card.getBoundingClientRect();
  const clone = card.cloneNode(true);
  clone.style.position='fixed';
  clone.style.left = rect.left+'px';
  clone.style.top = rect.top+'px';
  clone.style.width = rect.width+'px';
  clone.style.zIndex=999;
  clone.style.pointerEvents='none';
  clone.classList.add('dragging');
  document.body.appendChild(clone);
  card.style.visibility='hidden';
  dragCtx = {sx:e.clientX, sy:e.clientY, moved:false, id, card, clone, pointerId:e.pointerId, offX:e.clientX-rect.left, offY:e.clientY-rect.top};
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('pointercancel', onPointerCancel);
}
function onPointerMove(e){
  if(!dragCtx) return;
  e.preventDefault();
  if(Math.hypot(e.clientX-dragCtx.sx,e.clientY-dragCtx.sy)>8) dragCtx.moved=true;
  dragCtx.clone.style.left = (e.clientX-dragCtx.offX)+'px';
  dragCtx.clone.style.top = (e.clientY-dragCtx.offY)+'px';
  document.querySelectorAll('.drop-slot').forEach(s=>s.classList.remove('over'));
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const slot = under && under.closest && under.closest('.drop-slot');
  if(slot && !slot.classList.contains('locked')) slot.classList.add('over');
}
function endDrag(){
  document.removeEventListener('pointermove', onPointerMove);
  document.removeEventListener('pointerup', onPointerUp);
  document.removeEventListener('pointercancel', onPointerCancel);
}
function onPointerCancel(){
  // e.g. an incoming call/notification interrupted the gesture: just
  // snap the card back instead of leaving a stray floating clone.
  if(!dragCtx) return;
  endDrag();
  try{ dragCtx.card.releasePointerCapture(dragCtx.pointerId); }catch(err){}
  dragCtx.clone.remove();
  dragCtx.card.style.visibility='visible';
  dragCtx=null;
}
function onPointerUp(e){
  if(!dragCtx) return;
  endDrag();
  try{ dragCtx.card.releasePointerCapture(e.pointerId); }catch(err){}
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const slot = under && under.closest && under.closest('.drop-slot');
  dragCtx.clone.remove();
  dragCtx.card.style.visibility='visible';
  if(slot && !slot.classList.contains('locked')){ dropOn(dragCtx.id,slot); }
  else if(!dragCtx.moved){ const s=game.ddState; s.sel = s.sel===dragCtx.id ? null : dragCtx.id; }
  dragCtx=null;
  render();
}

document.addEventListener('keydown',(e)=>{
  const t=e.target;
  if((e.key==='Enter'||e.key===' ') && t && t.matches && t.matches('[data-goto]')){ e.preventDefault(); t.click(); return; }
  if(nav.screen!=='play' || !game) return;
  if(/^[1-4]$/.test(e.key)){ const b=[...document.querySelectorAll('.opt-btn')].filter(x=>!x.disabled)[+e.key-1]; if(b) b.click(); }
  else if(e.key==='Enter'){ const c=document.getElementById('check-btn'); if(c && t.tagName!=='BUTTON') c.click(); }
});
/* ====================== BOOT ====================== */
render();
</script>
</body>
</html>
